<script>
const SIZES=[15,20,25,32,40,50,65,80,100,125,150,200,250,300,350,400,450,500,550,600];
const USIZES=[15,20,25,32,40,50,65,80,100,125,150,200,250,300];

const DATA={
  "5K":{15:["M10",30,4],20:["M10",35,4],25:["M10",35,4],32:["M12",40,4],40:["M12",40,4],50:["M12",45,4],65:["M12",45,4],80:["M16",45,4],100:["M16",50,8],125:["M16",50,8],150:["M16",55,8],200:["M20",65,8],250:["M20",70,12],300:["M20",70,12],350:["M22",75,12],400:["M22",75,16],450:["M22",75,16],500:["M22",75,20],550:["M24",80,20],600:["M24",80,20]},
  "10K":{15:["M12",40,4],20:["M12",45,4],25:["M16",45,4],32:["M16",50,4],40:["M16",50,4],50:["M16",50,4],65:["M16",55,4],80:["M16",55,8],100:["M16",55,8],125:["M20",65,8],150:["M20",70,8],200:["M20",70,12],250:["M22",75,12],300:["M22",80,16],350:["M22",80,16],400:["M24",85,16],450:["M24",90,20],500:["M24",90,20],550:["M30",100,20],600:["M30",100,24]},
  "16K":{15:["M12",40,4],20:["M12",45,4],25:["M16",45,4],32:["M16",50,4],40:["M16",50,4],50:["M16",50,8],65:["M16",55,8],80:["M20",65,8],100:["M20",65,8],125:["M22",70,8],150:["M22",75,12],200:["M22",80,12],250:["M24",85,12],300:["M24",90,16],350:["M24",90,16],400:["M30",105,16],450:["M30",110,16],500:["M30",115,20],550:["M30",120,20],600:["M36",130,20]},
  "30K":{15:["M16",60,4],20:["M16",60,4],25:["M16",65,4],32:["M16",65,4],40:["M20",70,4],50:["M16",65,8],65:["M20",80,8],80:["M20",85,8],100:["M22",95,8],125:["M24",105,12],150:["M24",115,12],200:["M30",135,12],250:["M30",140,16],300:["M30",145,16],350:["M36",160,16]}
};
const RATING_ORDER={"5K":1,"10K":2,"16K":3,"30K":4};

// 제공된 도면 기준 플랜지 외경(OD) 데이터 업데이트
const FLANGE_OD_DATA = [
  // 5K
  { r: "5K", s: 15, od: 80 }, { r: "5K", s: 20, od: 85 }, { r: "5K", s: 25, od: 95 },
  { r: "5K", s: 32, od: 115 }, { r: "5K", s: 40, od: 120 }, { r: "5K", s: 50, od: 130 },

  { r: "10K", s: 65, od: 175 }, { r: "10K", s: 80, od: 185 }, { r: "10K", s: 100, od: 210 },

  { r: "10K", s: 250, od: 400 }, { r: "10K", s: 300, od: 445 }, { r: "10K", s: 350, od: 490 },
  { r: "10K", s: 400, od: 560 }, { r: "10K", s: 450, od: 620 }, { r: "10K", s: 500, od: 675 },
  { r: "10K", s: 550, od: 745 }, { r: "10K", s: 600, od: 795 },
  // 16K
  { r: "16K", s: 15, od: 95 }, { r: "16K", s: 20, od: 100 }, { r: "16K", s: 25, od: 125 },
  { r: "16K", s: 32, od: 135 }, { r: "16K", s: 40, od: 140 }, { r: "16K", s: 50, od: 155 },
  { r: "16K", s: 65, od: 175 }, { r: "16K", s: 80, od: 200 }, { r: "16K", s: 100, od: 225 },
  { r: "16K", s: 125, od: 270 }, { r: "16K", s: 150, od: 305 }, { r: "16K", s: 200, od: 350 },
  { r: "16K", s: 250, od: 430 }, { r: "16K", s: 300, od: 480 }, { r: "16K", s: 350, od: 540 },
  { r: "16K", s: 400, od: 605 }, { r: "16K", s: 450, od: 675 }, { r: "16K", s: 500, od: 730 },
  { r: "16K", s: 550, od: 795 }, { r: "16K", s: 600, od: 845 },
  // 30K
  { r: "30K", s: 15, od: 115 }, { r: "30K", s: 20, od: 120 }, { r: "30K", s: 25, od: 130 },
  { r: "30K", s: 32, od: 140 }, { r: "30K", s: 40, od: 160 }, { r: "30K", s: 50, od: 165 },

  { r: "30K", s: 125, od: 275 }, { r: "30K", s: 150, od: 325 }, { r: "30K", s: 200, od: 370 },
  { r: "30K", s: 250, od: 450 }, { r: "30K", s: 300, od: 515 }, { r: "30K", s: 350, od: 560 }
];

let queue = [];

const sizeSel=document.getElementById('size'),ratingSel=document.getElementById('rating');
const gsizeSel=document.getElementById('gsize'),gratingSel=document.getElementById('grating');
const usizeSel=document.getElementById('usize'),uqtyInput=document.getElementById('uqty');

// 플랜지 찾기 기능
function findFlange() {
  const targetOD = parseFloat(document.getElementById('searchOD').value);
  const resDiv = document.getElementById('searchResult');
  
  if (!targetOD) {
    resDiv.style.display = 'none';
    return;
  }

  const sorted = FLANGE_OD_DATA.map(f => {
    return { ...f, diff: Math.abs(f.od - targetOD) };
  }).sort((a, b) => a.diff - b.diff);

  const closestDiff = sorted[0].diff;
  const matches = sorted.filter(f => f.diff === closestDiff);

  resDiv.style.display = 'block';
  
  if (closestDiff > 25) {
    resDiv.innerHTML = `<div class="search-res-box" style="background:#fee2e2; border-color:#fca5a5; color:#991b1b;">⚠️ 오차가 큽니다 (최소 오차: ${closestDiff}mm). 수치를 다시 확인해주세요.</div>`;
  } else {
    let html = `<div class="search-res-box">🎯 <b>${targetOD}mm</b> 와 가장 가까운 규격 (오차 ${closestDiff}mm):<br><br>`;
    matches.forEach(m => {
      html += `• <b>${m.r} ${m.s}A</b> (실제 외경: ${m.od}mm)<br>`;
    });
    html += `</div>`;
    resDiv.innerHTML = html;
  }
}

function refreshSizes(){
  const r=ratingSel.value,prev=parseInt(sizeSel.value);
  sizeSel.innerHTML='';
  SIZES.forEach(s=>{if(DATA[r][s]){const o=document.createElement('option');o.value=s;o.textContent=s+'A';sizeSel.appendChild(o);}});
  if([...sizeSel.options].some(o=>+o.value===prev))sizeSel.value=prev;
}

function refreshGSizes(){
  const r=gratingSel.value,prev=parseInt(gsizeSel.value);
  gsizeSel.innerHTML='';
  SIZES.forEach(s=>{if(DATA[r][s]){const o=document.createElement('option');o.value=s;o.textContent=s+'A';gsizeSel.appendChild(o);}});
  if([...gsizeSel.options].some(o=>+o.value===prev))gsizeSel.value=prev;
}

function addPoint(){
  const r=ratingSel.value, s=parseInt(sizeSel.value), qty=parseInt(document.getElementById('qty').value)||1;
  const ext=document.getElementById('optExtended').checked;
  const optGasket=document.getElementById('optGasket').checked;
  const gType=document.getElementById('gTypeInFlange').value;

  if(!DATA[r][s]) return;
  const [bS,bL,bC]=DATA[r][s];
  
  queue.push({type:'bolt', r, s, qty, ext, bS, bL:ext?bL+5:bL, bC});
  if(optGasket){
    queue.push({type:'gasket', r, s, qty, gtype:gType, auto:true});
  }
  renderQueue();
}

function addGasket(){
  const r=gratingSel.value, s=parseInt(gsizeSel.value), qty=parseInt(document.getElementById('gqty').value)||1, type=document.getElementById('gtype').value;
  if(!DATA[r][s]) return;
  queue.push({type:'gasket', r, s, qty, gtype:type, auto:false});
  renderQueue();
}

function addUbolt(){
  const s=parseInt(usizeSel.value), qty=parseInt(uqtyInput.value)||1;
  queue.push({type:'ubolt', s, qty});
  renderQueue();
}

function delPoint(i){queue.splice(i,1);renderQueue();}
function clearAll(){if(queue.length&&!confirm('모두 삭제할까요?'))return;queue=[];renderQueue();document.getElementById('result').innerHTML='';}

function renderQueue(){
  const tb=document.getElementById('qBody');
  document.getElementById('qCount').textContent=`${queue.length}건`;
  if(!queue.length){tb.innerHTML='<div class="empty">항목이 없습니다.</div>';return;}
  let h='<div class="q-list">';
  queue.forEach((q,i)=>{
    let mainText='', subText='', numClass='', badge='';
    if(q.type==='bolt'){
      numClass=''; mainText=`${q.r} ${q.s}A 볼트`;
      subText=`${q.bS}×${q.bL}L · ${q.bC}개/포인트 × ${q.qty}pt`;
      if(q.ext) badge=`<span class="badge-opt">+5mm</span>`;
    }else if(q.type==='gasket'){
      numClass='g'; mainText=`${q.r} ${q.s}A 가스켓`;
      subText=`${q.gtype} · ${q.qty}장 ${q.auto ? '(포함)' : '(추가)'}`;
      badge=`<span class="badge-opt badge-g">${q.gtype}</span>`;
    }else{
      numClass='u'; mainText=`U-볼트 ${q.s}A`;
      subText=`${q.qty}set`;
      badge=`<span class="badge-opt badge-u">U-Bolt</span>`;
    }
    h+=`<div class="q-item"><div class="num ${numClass}">${i+1}</div><div class="info">
          <div class="main">${mainText} × ${q.qty}${badge}</div>
          <div class="sub">${subText}</div>
          <button class="btn-del" onclick="delPoint(${i})">삭제</button>
          </div></div>`;
  });
  tb.innerHTML=h+'</div>';
}

function calculate(){
  if(!queue.length){alert('항목을 추가하세요.');return;}
  const bM={}, gM={}, uM={};

  queue.forEach(q=>{
    if(q.type==='bolt'){
      const bK=`${q.bS}×${q.bL}L`; bM[bK]=(bM[bK]||0)+q.bC*q.qty;
    }else if(q.type==='gasket'){
      const gK=`${q.r} ${q.s}A (${q.gtype})`; gM[gK]=(gM[gK]||0)+q.qty;
    }else{
      const uK=`${q.s}A`; uM[uK]=(uM[uK]||0)+q.qty;
    }
  });

  const sB=Object.entries(bM).sort((a,b)=>{
    const pa=a[0].match(/M(\d+)/),pb=b[0].match(/M(\d+)/);
    return (+pa[1]-+pb[1]);
  }), 
  sG=Object.entries(gM).sort((a,b)=>{
    const [ra,sa]=a[0].split(' '), [rb,sb]=b[0].split(' ');
    return (RATING_ORDER[ra]-RATING_ORDER[rb])||(parseInt(sa)-parseInt(sb));
  }), 
  sU=Object.entries(uM).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));

  const res=`<div class="result"><h2>✅ 최종 집계 결과</h2><div class="res-grid">
    <div class="res-section"><h3>🔩 볼트/너트 (수량)</h3><div class="table-wrap"><table><thead><tr><th>규격</th><th>볼트</th><th>너트</th></tr></thead><tbody>${sB.map(([k,v])=>`<tr><td>${k}</td><td><b>${v}</b></td><td><b>${v}</b></td></tr>`).join('')||'<tr><td colspan="3">없음</td></tr>'}</tbody></table></div>
    <div class="res-section"><h3>⭕ 가스켓 (장수)</h3><div class="table-wrap"><table><thead><tr><th>규격/타입</th><th>수량</th></tr></thead><tbody>${sG.map(([k,v])=>`<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join('')||'<tr><td colspan="2">없음</td></tr>'}</tbody></table></div>
    </div>
    <div class="res-section" style="grid-column:1/-1"><h3>⚓ U-볼트 (세트)</h3><div class="table-wrap"><table><thead><tr><th class="u">규격</th><th class="u">수량(set)</th></tr></thead><tbody>${sU.map(([k,v])=>`<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join('')||'<tr><td colspan="2">없음</td></tr>'}</tbody></table></div>
    </div>
    <div class="footnote">※ 가스켓은 포인트 포함분과 추가 입력분이 자동 합산되었습니다.<br>※ 너트는 볼트와 1:1 수량으로 자동 계산됩니다.<br>※ U-볼트는 단순 개수(세트)만 집계됩니다.</div>
  </div>`;
  document.getElementById('result').innerHTML=res;
  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
}

function init(){
  USIZES.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s+'A';usizeSel.appendChild(o);});
  refreshSizes();
  refreshGSizes();
}
</script>
</body>
</html>
