<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightreign 맵 탐지기 — NR-Nightlord-Checker + NightreignMapFilter 연동</title>
<style>
  :root {
    color-scheme: light dark;
    --c-bg: #0b1220;
    --c-surface: #131f35;
    --c-surface-2: #1a2846;
    --c-border: #2d4270;
    --c-text: #e2e8f0;
    --c-text-sub: #94a3b8;
    --c-primary: #4f8ef7;
    --c-primary-weak: #1e3a6a;
    --c-success: #34d399;
    --c-success-weak: #064e3b;
    --c-warn: #fbbf24;
    --c-warn-weak: #451a03;
    --c-danger: #f87171;
    --c-danger-weak: #450a0a;
    --c-church: #f59e0b;
    --c-mage: #818cf8;
    --c-village: #34d399;
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --c-bg: #f1f5f9;
      --c-surface: #ffffff;
      --c-surface-2: #f8fafc;
      --c-border: #cbd5e1;
      --c-text: #0f172a;
      --c-text-sub: #475569;
      --c-primary: #2563eb;
      --c-primary-weak: #eff6ff;
      --c-success: #059669;
      --c-success-weak: #ecfdf5;
      --c-warn: #d97706;
      --c-warn-weak: #fef3c7;
      --c-danger: #dc2626;
      --c-danger-weak: #fee2e2;
      --c-church: #d97706;
      --c-mage: #4f46e5;
      --c-village: #059669;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--c-bg);
    color: var(--c-text);
    min-height: 100vh;
    padding: 16px;
  }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
  h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; color: var(--c-primary); }
  .subtitle { color: var(--c-text-sub); font-size: 0.85rem; margin-bottom: 20px; }
  .card {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--r-lg);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--c-text-sub);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--c-border);
  }
  textarea {
    width: 100%;
    background: var(--c-surface-2);
    color: var(--c-text);
    border: 1px solid var(--c-border);
    border-radius: var(--r-md);
    padding: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.85rem;
    resize: vertical;
    min-height: 120px;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--c-primary); }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: var(--r-md);
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--c-primary); color: #fff; }
  .btn-primary:hover { opacity: .88; }
  .btn-secondary {
    background: var(--c-surface-2);
    color: var(--c-text);
    border: 1px solid var(--c-border);
  }
  .btn-secondary:hover { border-color: var(--c-primary); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .info-item {
    background: var(--c-surface-2);
    border: 1px solid var(--c-border);
    border-radius: var(--r-md);
    padding: 12px 14px;
  }
  .info-label { font-size: 0.75rem; color: var(--c-text-sub); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .info-value { font-size: 1rem; font-weight: 700; color: var(--c-text); }
  .info-value.highlight { color: var(--c-primary); }
  .info-value.success { color: var(--c-success); }
  .info-value.warn { color: var(--c-warn); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.78rem;
    font-weight: 600;
    vertical-align: middle;
  }
  .badge-church { background: var(--c-warn-weak); color: var(--c-church); border: 1px solid var(--c-church); }
  .badge-mage   { background: var(--c-primary-weak); color: var(--c-primary); border: 1px solid var(--c-primary); }
  .badge-village { background: var(--c-success-weak); color: var(--c-success); border: 1px solid var(--c-success); }
  .map-canvas-wrap {
    position: relative;
    display: inline-block;
    background: var(--c-surface-2);
    border: 1px solid var(--c-border);
    border-radius: var(--r-lg);
    overflow: hidden;
    margin-top: 8px;
  }
  canvas { display: block; max-width: 100%; }
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-size: 0.82rem;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-dot.church { background: #f59e0b; }
  .legend-dot.mage { background: #818cf8; }
  .legend-dot.village { background: #34d399; }
  .manual-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 520px) { .manual-grid { grid-template-columns: 1fr; } }
  .nl-btn, .map-btn {
    padding: 8px 12px;
    border-radius: var(--r-sm);
    border: 1px solid var(--c-border);
    background: var(--c-surface-2);
    color: var(--c-text);
    cursor: pointer;
    font-size: 0.82rem;
    text-align: left;
    transition: border-color .15s, background .15s;
  }
  .nl-btn:hover, .map-btn:hover { border-color: var(--c-primary); background: var(--c-primary-weak); }
  .nl-btn.active, .map-btn.active { border-color: var(--c-primary); background: var(--c-primary-weak); color: var(--c-primary); font-weight: 600; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  select {
    padding: 8px 12px;
    border-radius: var(--r-md);
    border: 1px solid var(--c-border);
    background: var(--c-surface-2);
    color: var(--c-text);
    font-size: 0.88rem;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--c-primary); }
  #result-section { display: none; }
  .poi-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .poi-table th, .poi-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--c-border); }
  .poi-table th { color: var(--c-text-sub); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  .everdark-yes { color: var(--c-warn); font-weight: 700; }
  .everdark-no { color: var(--c-text-sub); }
  .alert {
    padding: 12px 16px;
    border-radius: var(--r-md);
    font-size: 0.88rem;
    margin-bottom: 12px;
  }
  .alert-error { background: var(--c-danger-weak); color: var(--c-danger); border: 1px solid var(--c-danger); }
  .alert-info { background: var(--c-primary-weak); color: var(--c-primary); border: 1px solid var(--c-primary); }
  .separator { height: 1px; background: var(--c-border); margin: 16px 0; }
  .source-link { color: var(--c-primary); text-decoration: none; font-size: 0.82rem; }
  .source-link:hover { text-decoration: underline; }
  label { display: block; font-size: 0.85rem; color: var(--c-text-sub); margin-bottom: 6px; }
  .section-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
</style>
</head>

<div style="max-width:860px;margin:0 auto;">
  <h1>🗺️ Nightreign 맵 탐지기</h1>
  <p class="subtitle">

  <!-- Manual selection -->

      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="applyManual()">🔍 수동 분석</button>
    </div>
  </div>

  <!-- Result section -->
  <div id="result-section">
    <div class="card">
      <div class="card-title">📊 탐지 결과</div>
      <div class="info-grid" id="result-info-grid"></div>
    </div>

    <div class="card">

      <div id="map-info-content"></div>
    </div>

</div>

const TOTAL_SEEDS = 320;

  "Mountaintop":  "산정 (Mountaintop)",
  "Crater":       "분화구 (Crater)",

// Nightlord display names
const NL_NAMES = ["Gladius", "Adel", "Gnoster", "Maris", "Libra", "Fulghor", "Caligo", "Heolstor", "Harmonia", "Straghess"];

// POI type colors and labels
const POI_STYLE = {
  church:  { color: "#f59e0b", label: "교회 (Church)",  emoji: "⛪" },
  mage:    { color: "#818cf8", label: "마법탑 (Mage)",   emoji: "🔮" },
  village: { color: "#34d399", label: "마을 (Village)", emoji: "🏘️" }

let selectedNL = null;

// Build manual NL buttons
const nlContainer = document.getElementById('nl-buttons');
NL_NAMES.forEach(name => {
  const btn = document.createElement('button');
  btn.className = 'nl-btn';
  btn.textContent = name;
  btn.dataset.nl = name;
  btn.onclick = () => {
    document.querySelectorAll('.nl-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedNL = name;
  };
  nlContainer.appendChild(btn);
});

function clearAll() {
  document.getElementById('checkerOutput').value = '';
  document.getElementById('parse-error').style.display = 'none';
  document.getElementById('result-section').style.display = 'none';
  document.querySelectorAll('.nl-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('manualSessionId').value = '';
  selectedNL = null;
}

function showError(msg) {
  const el = document.getElementById('parse-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function parseCheckerOutput() {
  const raw = document.getElementById('checkerOutput').value;
  document.getElementById('parse-error').style.display = 'none';

  if (!raw.trim()) {
    showError('❌ 출력 내용을 붙여넣어 주세요.');
    return;
  }

  const nickMatch    = raw.match(/Nickname:\s*(.+)/i);
  const sessionMatch = raw.match(/Last Session ID:\s*(\d+)/i);
  const bossMatch    = raw.match(/Boss:\s*(\w+)/i);
  const everdarkMatch = raw.match(/Everdark Sovereign\?\s*(\S+)/i);

  if (!bossMatch) {
    showError('❌ "Boss: ..." 항목을 찾을 수 없습니다. NR-Nightlord-Checker 출력이 맞는지 확인하세요.');
    return;
  }

  const nickname  = nickMatch ? nickMatch[1].trim() : '알 수 없음';
  const sessionId = sessionMatch ? parseInt(sessionMatch[1], 10) : null;
  const boss      = bossMatch[1].trim();
  // Normalise everdark to uppercase for consistent comparison
  const everdark  = everdarkMatch ? everdarkMatch[1].trim().toUpperCase() : null;

  showResult({ nickname, sessionId, boss, everdark });
}

function applyManual() {
  if (!selectedNL) {
    showError('나이트로드를 선택해 주세요.');
    document.getElementById('parse-error').style.display = 'block';
    return;
  }
  document.getElementById('parse-error').style.display = 'none';
  const sessionIdRaw = document.getElementById('manualSessionId').value.trim();
  const sessionId = sessionIdRaw ? parseInt(sessionIdRaw, 10) : null;
  if (sessionIdRaw && (isNaN(sessionId) || sessionId < 0)) {
    showError('세션 ID는 0 이상의 정수여야 합니다.');
    document.getElementById('parse-error').style.display = 'block';
    return;
  }
  showResult({ nickname: null, sessionId, boss: selectedNL, everdark: null });
}

function showResult(info) {
  const { nickname, sessionId, boss, everdark } = info;

  // Compute seed number if session ID is available
  let seedNumber = null;
  let seedData   = null;
  if (sessionId !== null && !isNaN(sessionId)) {
    seedNumber = sessionId % TOTAL_SEEDS;
    seedData   = SEEDS[seedNumber.toString()];
  }

  // Determine map type; detect nightlord mismatch
  let mapType = null;
  let mismatchWarning = null;
  if (seedData) {
    mapType = seedData.map;
    if (seedData.nl.toLowerCase() !== boss.toLowerCase()) {
      mismatchWarning = `⚠️ 시드 #${seedNumber}의 나이트로드(${seedData.nl})가 탐지된 보스(${boss})와 다릅니다. 세션 ID를 확인해 주세요.`;
    }
  }

  // Build info grid
  const grid = document.getElementById('result-info-grid');
  grid.innerHTML = '';

  const items = [
    ...(nickname ? [{ label: '닉네임', value: nickname, cls: '' }] : []),
    ...(sessionId !== null ? [{ label: '세션 ID', value: sessionId.toLocaleString(), cls: 'highlight' }] : []),
    { label: '탐지 보스', value: boss, cls: 'highlight' },
    ...(seedNumber !== null ? [{ label: '시드 번호', value: seedNumber, cls: 'success' }] : []),
    ...(mapType ? [{ label: '맵 타입', value: MAP_KO[mapType] || mapType, cls: 'success' }] : []),
    ...(everdark ? [{ label: 'Everdark Sovereign', value: everdark === 'YES' ? '✅ YES' : '❌ No', cls: everdark === 'YES' ? 'warn' : '' }] : [])
  ];

  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'info-item';
    div.innerHTML = `<div class="info-label">${item.label}</div><div class="info-value ${item.cls}">${item.value}</div>`;
    grid.appendChild(div);
  });

  // Build map info content
  const mapContent = document.getElementById('map-info-content');
  mapContent.innerHTML = '';

  // Show mismatch warning if detected
  if (mismatchWarning) {
    const warnDiv = document.createElement('div');
    warnDiv.className = 'alert alert-error';
    warnDiv.textContent = mismatchWarning;
    mapContent.appendChild(warnDiv);
  }

  if (seedData && mapType) {
    // Show seed-specific POI info
    const pois = seedData.pois || {};
    const mapCoords = POIS_BY_MAP[mapType] || [];

    // POI table
    const tableHtml = buildPOITable(pois, mapCoords, mapType);
    mapContent.innerHTML = tableHtml;

    // Draw canvas map
    const canvasWrap = document.createElement('div');
    canvasWrap.className = 'map-canvas-wrap';
    canvasWrap.style.marginTop = '16px';
    const canvas = document.createElement('canvas');
    canvas.width = 750;
    canvas.height = 750;
    canvasWrap.appendChild(canvas);
    mapContent.appendChild(canvasWrap);

    // Legend
    const legendDiv = document.createElement('div');
    legendDiv.className = 'legend';
    legendDiv.innerHTML = Object.entries(POI_STYLE).map(([t, s]) =>
      `<div class="legend-item"><div class="legend-dot ${t}"></div>${s.label}</div>`
    ).join('');
    mapContent.appendChild(legendDiv);

    drawMap(canvas, mapType, pois, mapCoords);

  } else if (boss) {
    // No seed data — show possible maps for this nightlord
    const possibleMaps = getPossibleMaps(boss);
    if (possibleMaps.length > 0) {
      let html = `<div class="alert alert-info">세션 ID가 없어 시드를 특정할 수 없습니다. 보스 "${boss}"는 다음 맵 타입에 등장할 수 있습니다:</div>`;
      html += '<div class="btn-group" style="margin-bottom:16px;">' +
        possibleMaps.map(m => `<button class="map-btn" onclick="showMapPreview('${m}', '${boss}')">${MAP_KO[m] || m}</button>`).join('') +
        '</div>';
      html += '<div id="map-preview-area"></div>';
      mapContent.innerHTML = html;
    } else {
      mapContent.innerHTML = `<div class="alert alert-error">보스 "${boss}"에 대한 맵 데이터를 찾을 수 없습니다. (Harmonia/Straghess는 아직 데이터셋에 없을 수 있습니다)</div>`;
    }
  }

  document.getElementById('result-section').style.display = 'block';
  document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function getPossibleMaps(boss) {
  const maps = new Set();
  Object.values(SEEDS).forEach(s => {
    if (s.nl.toLowerCase() === boss.toLowerCase()) maps.add(s.map);
  });
  return [...maps];
}

function showMapPreview(mapType, boss) {
  document.querySelectorAll('.map-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === (MAP_KO[mapType] || mapType));
  });

  const area = document.getElementById('map-preview-area');
  if (!area) return;

  // Find seeds for this boss+map combo
  const matchingSeeds = Object.entries(SEEDS)
    .filter(([, s]) => s.nl.toLowerCase() === boss.toLowerCase() && s.map === mapType)
    .map(([num, s]) => ({ num: parseInt(num), ...s }));

  if (matchingSeeds.length === 0) {
    area.innerHTML = '<div class="alert alert-error">일치하는 시드가 없습니다.</div>';
    return;
  }

  const mapCoords = POIS_BY_MAP[mapType] || [];

  let html = `<p style="font-size:.85rem;color:var(--c-text-sub);margin-bottom:10px;">
    보스 <strong>${boss}</strong> + <strong>${MAP_KO[mapType] || mapType}</strong> 조합: ${matchingSeeds.length}개 시드
  </p>`;
  html += buildSeedListTable(matchingSeeds);
  area.innerHTML = html;
}

function buildSeedListTable(seeds) {
  let rows = seeds.map(s => {
    const poisStr = Object.entries(s.pois).map(([id, type]) => {
      const st = POI_STYLE[type] || {};
      return `<span class="badge badge-${type}">${st.emoji || ''} POI#${id}</span>`;
    }).join(' ');
    return `<tr><td>${s.num}</td><td>${poisStr}</td></tr>`;
  }).join('');

  return `<div style="overflow-x:auto;"><table class="poi-table">
    <thead><tr><th>시드 #</th><th>POI 배치</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function buildPOITable(pois, mapCoords, mapType) {
  const coordMap = {};
  mapCoords.forEach(c => { coordMap[c.id] = c; });

  const rows = Object.entries(pois).map(([id, type]) => {
    const coord = coordMap[id];
    const st = POI_STYLE[type] || { color: '#888', label: type, emoji: '?' };
    const coordStr = coord ? `(${coord.x}, ${coord.y})` : '—';
    return `<tr>
      <td>POI #${id}</td>
      <td><span class="badge badge-${type}">${st.emoji} ${st.label}</span></td>
      <td style="color:var(--c-text-sub);font-size:.82rem;">${coordStr}</td>
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto;"><table class="poi-table">
    <thead><tr><th>POI 슬롯</th><th>타입</th><th>좌표 (900×900 기준)</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function drawMap(canvas, mapType, pois, mapCoords) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  // ORIG is the coordinate system scale used by NightreignMapFilter (900×900).
  // The canvas itself is rendered at 750×750 for display.
  const ORIG = 900;
  const scale = W / ORIG;

  // Background — use a dark static fallback so getComputedStyle is not called per draw
  const bgColor = getComputedStyle(document.documentElement)
    .getPropertyValue('--c-surface-2').trim() || '#1a2846';
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);

  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 9; i++) {
    ctx.beginPath(); ctx.moveTo(i * W / 9, 0); ctx.lineTo(i * W / 9, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * H / 9); ctx.lineTo(W, i * H / 9); ctx.stroke();
  }

  // Map name watermark
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.font = `bold ${Math.floor(W * 0.08)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(mapType.toUpperCase(), W / 2, H / 2);

  // Draw inactive POI slots (all map slots, grey)
  const coordMap = {};
  mapCoords.forEach(c => { coordMap[c.id] = c; });

  mapCoords.forEach(c => {
    const x = c.x * scale, y = c.y * scale;
    ctx.beginPath();
    ctx.arc(x, y, 12 * scale, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Slot number
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = `${Math.floor(9 * scale)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(c.id), x, y);
  });

  // Draw active POIs (seed-specific)
  Object.entries(pois).forEach(([idStr, type]) => {
    const id = parseInt(idStr, 10);
    const coord = coordMap[id];
    if (!coord) return;

    const x = coord.x * scale, y = coord.y * scale;
    const color = POI_STYLE[type] ? POI_STYLE[type].color : '#888888';

    // Outer glow
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, 20 * scale);
    gradient.addColorStop(0, color + '60');
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, 20 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Main circle
    ctx.beginPath();
    ctx.arc(x, y, 14 * scale, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    // ID label
    ctx.fillStyle = '#000';
    ctx.font = `bold ${Math.floor(10 * scale)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(id), x, y);
  });
}
</script>
